<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <defs>
    <!-- Comic halftone pattern -->
    <pattern id="halftone" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.5" fill="#e6b800" opacity="0.6"/>
    </pattern>
    <pattern id="comic-dots" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.8" fill="#000000" opacity="0.08"/>
    </pattern>
    <filter id="comic-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#111111" flood-opacity="1"/>
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Yellow -->
  <rect width="800" height="1100" fill="#FFD200"/>
  <rect width="800" height="1100" fill="url(#halftone)"/>

  <!-- Comic Outer Border -->
  <rect x="20" y="20" width="760" height="1060" fill="none" stroke="#111111" stroke-width="8" rx="8"/>

  <!-- Top Dark Header Band -->
  <rect x="28" y="28" width="744" height="90" fill="#111111"/>
  <text x="400" y="70" fill="#FFD200" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" letter-spacing="4" text-anchor="middle" font-weight="900">
    THE DEFINITIVE COMIC SURVIVAL MANUAL
  </text>
  <text x="400" y="98" fill="#FFFFFF" font-family="'Trebuchet MS', 'Arial', sans-serif" font-size="15" letter-spacing="2" text-anchor="middle" font-weight="bold">
    SPECIAL ILLUSTRATED &amp; PRINT EDITION
  </text>

  <!-- "FOR DUMMIES" Style Pill Badge -->
  <g transform="translate(400, 185)">
    <rect x="-240" y="-35" width="480" height="70" rx="35" fill="#111111" filter="url(#comic-shadow)"/>
    <rect x="-234" y="-30" width="468" height="60" rx="30" fill="#FF4757" stroke="#111111" stroke-width="4"/>
    <text x="0" y="10" fill="#FFFFFF" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" letter-spacing="3" text-anchor="middle">
      A DUMMY GUIDE TO
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(400, 310)">
    <rect x="-350" y="-35" width="700" height="85" fill="#FFFFFF" stroke="#111111" stroke-width="6" rx="6" filter="url(#comic-shadow)"/>
    <text x="0" y="22" fill="#111111" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" letter-spacing="2" text-anchor="middle">
      HAVING A RELATIONSHIP WITH
    </text>
  </g>

  <!-- Huge "CHRIS" Title in Comic Pop Style -->
  <g transform="translate(400, 470)">
    <!-- Comic Action Blast Behind Name -->
    <path d="M-360,-40 L-260,-90 L-180,-120 L-60,-80 L40,-130 L160,-90 L270,-115 L350,-40 L310,40 L360,100 L230,85 L140,125 L0,80 L-130,120 L-240,85 L-330,110 L-310,30 Z"
          fill="#00D2D3" stroke="#111111" stroke-width="7" filter="url(#comic-shadow)"/>
    <text x="4" y="44" fill="#111111" font-family="'Impact', 'Arial Black', sans-serif" font-size="135" font-weight="900" letter-spacing="6" text-anchor="middle">
      CHRIS!
    </text>
    <text x="0" y="40" fill="#FFFFFF" font-family="'Impact', 'Arial Black', sans-serif" font-size="135" font-weight="900" letter-spacing="6" text-anchor="middle">
      CHRIS!
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(400, 575)">
    <rect x="-340" y="-22" width="680" height="48" fill="#111111" rx="4"/>
    <text x="0" y="10" fill="#FFD200" font-family="'Trebuchet MS', 'Arial', sans-serif" font-size="19" font-weight="bold" letter-spacing="1.5" text-anchor="middle">
      NAVIGATING LIFE WITH THE LION • ENFP-T &amp; SYSTEMS BUILDER
    </text>
  </g>

  <!-- Comic Strip Panels in the Center -->
  <!-- Panel 1: Mood Indicator -->
  <g transform="translate(60, 630)">
    <rect width="210" height="230" fill="#FFFFFF" stroke="#111111" stroke-width="5" rx="6" filter="url(#comic-shadow)"/>
    <rect x="0" y="0" width="210" height="35" fill="#111111"/>
    <text x="105" y="24" fill="#FFD200" font-family="'Arial Black', sans-serif" font-size="14" text-anchor="middle">PANEL 1: MORNING</text>
    <!-- Coffee Cup Icon -->
    <ellipse cx="105" cy="110" rx="35" ry="30" fill="#FFA502" stroke="#111111" stroke-width="4"/>
    <path d="M 135 100 C 160 100, 160 120, 135 125" fill="none" stroke="#111111" stroke-width="4"/>
    <!-- Steam -->
    <path d="M 95 75 Q 90 60 98 48 M 105 75 Q 112 60 106 48 M 115 75 Q 110 60 118 48" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
    <text x="105" y="170" fill="#111111" font-family="'Trebuchet MS', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Status: Pre-Caffeine</text>
    <text x="105" y="195" fill="#FF4757" font-family="'Arial Black', sans-serif" font-size="13" text-anchor="middle">DO NOT APPROACH</text>
  </g>

  <!-- Panel 2: Snack Mode -->
  <g transform="translate(295, 630)">
    <rect width="210" height="230" fill="#FFFFFF" stroke="#111111" stroke-width="5" rx="6" filter="url(#comic-shadow)"/>
    <rect x="0" y="0" width="210" height="35" fill="#111111"/>
    <text x="105" y="24" fill="#FFD200" font-family="'Arial Black', sans-serif" font-size="14" text-anchor="middle">PANEL 2: EMERGENCY</text>
    <!-- Pizza Slice / Snack Icon -->
    <path d="M 105 65 L 145 135 L 65 135 Z" fill="#FFD200" stroke="#111111" stroke-width="4"/>
    <circle cx="95" cy="105" r="7" fill="#FF4757" stroke="#111111" stroke-width="2"/>
    <circle cx="115" cy="120" r="6" fill="#FF4757" stroke="#111111" stroke-width="2"/>
    <circle cx="105" cy="90" r="5" fill="#FF4757" stroke="#111111" stroke-width="2"/>
    <text x="105" y="170" fill="#111111" font-family="'Trebuchet MS', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Hangry Level: 90%</text>
    <text x="105" y="195" fill="#2ED573" font-family="'Arial Black', sans-serif" font-size="13" text-anchor="middle">ADMINISTER FOOD</text>
  </g>

  <!-- Panel 3: Happy State -->
  <g transform="translate(530, 630)">
    <rect width="210" height="230" fill="#FFFFFF" stroke="#111111" stroke-width="5" rx="6" filter="url(#comic-shadow)"/>
    <rect x="0" y="0" width="210" height="35" fill="#111111"/>
    <text x="105" y="24" fill="#FFD200" font-family="'Arial Black', sans-serif" font-size="14" text-anchor="middle">PANEL 3: EQUILIBRIUM</text>
    <!-- Big Smiley / Battery Icon -->
    <circle cx="105" cy="105" r="38" fill="#70A1FF" stroke="#111111" stroke-width="4"/>
    <circle cx="92" cy="98" r="5" fill="#111111"/>
    <circle cx="118" cy="98" r="5" fill="#111111"/>
    <path d="M 88 118 Q 105 135 122 118" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
    <text x="105" y="170" fill="#111111" font-family="'Trebuchet MS', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Recharged &amp; Calm</text>
    <text x="105" y="195" fill="#5352ED" font-family="'Arial Black', sans-serif" font-size="13" text-anchor="middle">READY TO TALK</text>
  </g>

  <!-- Comic Speech Bubble -->
  <g transform="translate(130, 895)">
    <path d="M 20 0 L 220 0 C 235 0 240 10 240 25 L 240 55 C 240 70 235 75 220 75 L 140 75 L 110 105 L 115 75 L 20 75 C 5 75 0 70 0 55 L 0 25 C 0 10 5 0 20 0 Z"
          fill="#FFFFFF" stroke="#111111" stroke-width="4" filter="url(#soft-shadow)"/>
    <text x="120" y="32" fill="#111111" font-family="'Arial Black', sans-serif" font-size="14" text-anchor="middle">"READ THE MANUAL FIRST,</text>
    <text x="120" y="54" fill="#111111" font-family="'Arial Black', sans-serif" font-size="14" text-anchor="middle">BLAME CHRIS LATER!"</text>
  </g>

  <!-- Comic Starburst Badge (Right Side) -->
  <g transform="translate(620, 930)">
    <path d="M 0 -60 L 18 -20 L 58 -40 L 40 0 L 65 30 L 25 35 L 25 70 L -10 45 L -45 65 L -35 25 L -70 10 L -35 -15 L -55 -45 L -15 -35 Z"
          fill="#FF4757" stroke="#111111" stroke-width="4" filter="url(#soft-shadow)"/>
    <text x="0" y="-8" fill="#FFFFFF" font-family="'Impact', 'Arial Black', sans-serif" font-size="15" text-anchor="middle" transform="rotate(-6)">
      BLANK FORM
    </text>
    <text x="0" y="12" fill="#FFD200" font-family="'Impact', 'Arial Black', sans-serif" font-size="15" text-anchor="middle" transform="rotate(-6)">
      READY FOR
    </text>
    <text x="0" y="30" fill="#FFFFFF" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" text-anchor="middle" transform="rotate(-6)">
      YOUR INPUT!
    </text>
  </g>

  <!-- Bottom Dark Footer Band -->
  <rect x="28" y="1005" width="744" height="65" fill="#111111"/>
  <text x="50" y="1045" fill="#FFD200" font-family="'Arial Black', sans-serif" font-size="16">
    AUTHOR: CHRIS "LION" KAMITOR
  </text>
  <text x="750" y="1045" fill="#FFFFFF" font-family="'Trebuchet MS', sans-serif" font-size="15" font-weight="bold" text-anchor="end">
    COMPLETE WITH CALIBRATION FORM &amp; PRINTABLE CHEAT SHEET
  </text>
</svg>
