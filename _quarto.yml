project:
  type: book
  output-dir: _book
  resources:
    - "relatietherapie-chris.pdf"
    - "relatietherapie-kirsten.pdf"
    - "relatietherapie-dossier-chris-en-kirsten.pdf"
    - "relatietherapie-dossier.pdf"
    - "relatie-handboek.pdf"
    - "dossier-partner-1.pdf"
    - "dossier-partner-2.pdf"
  post-render: scripts/post-render.sh

lang: nl

book:
  title: "Relatie Voor Dummies: Chris & Kirsten Editie"
  subtitle: "Het Geïllustreerde Overlevingshandboek (Handleiding voor Chris & Handleiding voor Kirsten)"
  author: "Chris & Kirsten"
  date: today
  cover-image: assets/cover.png
  page-navigation: true
  downloads: [pdf]
  sidebar:
    style: docked
    search: true
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Deel I: Handleiding voor Chris (Veldgids voor Kirsten)"
      chapters:
        - intro.qmd
        - enfj-dynamic.qmd
        - habitat.qmd
        - communication.qmd
        - planning.qmd
        - conflict.qmd
        - intimacy.qmd
        - play.qmd
        - easter-eggs.qmd
    - part: "Deel II: Kirsten's Versie: Handleiding voor Kirsten (Veldgids voor Chris)"
      chapters:
        - kirsten-intro.qmd
        - kirsten-communication.qmd
        - kirsten-conflict.qmd
        - kirsten-summary.qmd
    - part: "Deel III: Kalibratie & Langetermijnzorg"
      chapters:
        - intake-form.qmd
        - summary.qmd

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    number-sections: false
    fig-responsive: true
  typst:
    toc: true
    toc-depth: 2
    number-sections: false
    papersize: a4
    margin:
      x: 2cm
      y: 2.5cm
    mainfont: "Comic Neue"
    font-paths: ["fonts"]
    include-in-header: typst-style.typ
